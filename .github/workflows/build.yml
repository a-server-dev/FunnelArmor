name: Build and publish resource pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile, test and package
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify generated resource pack
        shell: bash
        run: |
          set -euo pipefail
          zip=build/generated/funnel-pack/funnel-pack.zip
          test -s "$zip"
          unzip -t "$zip" > /dev/null
          sha1sum "$zip"
      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunnelArmor-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload resource pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunnelArmor-resourcepack
          path: build/generated/funnel-pack/funnel-pack.zip
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FunnelArmor-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
      - name: Explain why private repositories cannot distribute public packs
        if: ${{ github.event_name != 'pull_request' && github.event.repository.private == true }}
        run: |
          echo "### Resource-pack publishing is not enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "This source repository is PRIVATE. GitHub Release assets in private" >> "$GITHUB_STEP_SUMMARY"
          echo "repositories cannot be downloaded by Minecraft players anonymously." >> "$GITHUB_STEP_SUMMARY"
          echo "No source visibility was changed. Use a public distribution repository" >> "$GITHUB_STEP_SUMMARY"
          echo "(which requires separate write credentials), or make this repository" >> "$GITHUB_STEP_SUMMARY"
          echo "public only after reviewing the full source and commit history." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: build
    # Only anonymous-accessible PUBLIC releases are usable as Minecraft packs.
    # NEVER silently change repository visibility or upload public assets from
    # private source projects without explicit author consent.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    concurrency:
      group: funnelarmor-pack-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download the exact resource pack used by the successful JAR build
        uses: actions/download-artifact@v4
        with:
          name: FunnelArmor-resourcepack
          path: pack
      - name: Create or reuse SHA-1 keyed GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s pack/funnel-pack.zip
          hash="$(sha1sum pack/funnel-pack.zip | cut -d' ' -f1)"
          tag="pack-${hash}"
          filename="funnel-pack-${hash}.zip"
          cp pack/funnel-pack.zip "pack/${filename}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$filename"; then
              echo "Identical pack already published at $tag"
            else
              gh release upload "$tag" "pack/${filename}"
            fi
          else
            gh release create "$tag" "pack/${filename}" \
              --target "$GITHUB_SHA" \
              --title "FunnelArmor resource pack ${hash:0:12}" \
              --notes "Automatically published Minecraft resource pack. SHA-1: ${hash}" \
              --prerelease --latest=false
          fi
          url="https://github.com/${GH_REPO}/releases/download/${tag}/${filename}"
          echo "### Published resource pack" >> "$GITHUB_STEP_SUMMARY"
          echo "ZIP SHA-1: \`${hash}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download URL: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "This URL is automatically generated by FunnelArmor v0.7.7+." >> "$GITHUB_STEP_SUMMARY"
          # Confirm real public downloads, including GitHub's redirect, and
          # validate the downloaded bytes rather than trusting a release page.
          curl --fail --location --retry 5 --retry-delay 2 \
            --silent --show-error --output pack/public-check.zip "$url"
          actual="$(sha1sum pack/public-check.zip | cut -d' ' -f1)"
          if [[ "$actual" != "$hash" ]]; then
            echo "::error::The public GitHub Release download did not match the bundled pack SHA-1"
            exit 1
          fi
          echo "Public ZIP download verified with matching SHA-1."
