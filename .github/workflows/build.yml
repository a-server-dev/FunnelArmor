name: Build and publish resource pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile, test and package
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify generated resource pack
        shell: bash
        run: |
          set -euo pipefail
          zip=build/generated/funnel-pack/funnel-pack.zip
          test -s "$zip"
          unzip -t "$zip" > /dev/null
          sha1sum "$zip"
      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunnelArmor-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload resource pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FunnelArmor-resourcepack
          path: build/generated/funnel-pack/funnel-pack.zip
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FunnelArmor-test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
      - name: Explain why private repositories cannot distribute public packs
        if: ${{ github.event_name != 'pull_request' && github.event.repository.private == true }}
        run: |
          echo "### Resource-pack publishing is not enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "This source repository is PRIVATE. GitHub Release assets in private" >> "$GITHUB_STEP_SUMMARY"
          echo "repositories cannot be downloaded by Minecraft players anonymously." >> "$GITHUB_STEP_SUMMARY"
          echo "No source visibility was changed. Use a public distribution repository" >> "$GITHUB_STEP_SUMMARY"
          echo "(which requires separate write credentials), or make this repository" >> "$GITHUB_STEP_SUMMARY"
          echo "public only after reviewing the full source and commit history." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: build
    # Only anonymous-accessible PUBLIC releases are usable as Minecraft packs.
    # NEVER silently change repository visibility or upload public assets from
    # private source projects without explicit author consent.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    concurrency:
      group: funnelarmor-pack-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download the exact resource pack used by the successful JAR build
        uses: actions/download-artifact@v4
        with:
          name: FunnelArmor-resourcepack
          path: pack
      - name: Create or reuse SHA-1 keyed GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s pack/funnel-pack.zip
          hash="$(sha1sum pack/funnel-pack.zip | cut -d' ' -f1)"
          tag="pack-${hash}"
          filename="funnel-pack-${hash}.zip"
          cp pack/funnel-pack.zip "pack/${filename}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$filename"; then
              echo "Identical pack already published at $tag"
            else
              gh release upload "$tag" "pack/${filename}"
            fi
          else
            gh release create "$tag" "pack/${filename}" \
              --target "$GITHUB_SHA" \
              --title "FunnelArmor resource pack ${hash:0:12}" \
              --notes "Automatically published Minecraft resource pack. SHA-1: ${hash}" \
              --prerelease --latest=false
          fi
          url="https://github.com/${GH_REPO}/releases/download/${tag}/${filename}"
          echo "### Published resource pack" >> "$GITHUB_STEP_SUMMARY"
          echo "ZIP SHA-1: \`${hash}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download URL: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "This URL is automatically generated by FunnelArmor v0.7.7+." >> "$GITHUB_STEP_SUMMARY"
          # Confirm real public downloads, including GitHub's redirect, and
          # validate the downloaded bytes rather than trusting a release page.
          curl --fail --location --retry 5 --retry-delay 2 \
            --silent --show-error --output pack/public-check.zip "$url"
          actual="$(sha1sum pack/public-check.zip | cut -d' ' -f1)"
          if [[ "$actual" != "$hash" ]]; then
            echo "::error::The public GitHub Release download did not match the bundled pack SHA-1"
            exit 1
          fi
          echo "Public ZIP download verified with matching SHA-1."

  publish-direct:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    concurrency:
      group: funnelarmor-pack-assets
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out sources with branch-push permission
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download same pack bundled into JAR
        uses: actions/download-artifact@v4
        with:
          name: FunnelArmor-resourcepack
          path: ${{ runner.temp }}/funnel-pack
      - name: Publish immutable ZIP to pack-assets branch
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/funnel-pack/funnel-pack.zip"
          test -s "$input"
          hash="$(sha1sum "$input" | cut -d' ' -f1)"
          filename="funnel-pack-${hash}.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin pack-assets >/dev/null; then
            git fetch --depth=1 origin pack-assets
            git switch -C pack-assets FETCH_HEAD
          else
            git switch --orphan pack-assets
            git rm -rf --ignore-unmatch . >/dev/null || true
          fi
          # Never overwrite an existing hash-addressed object.
          if [[ -e "$filename" ]]; then
            test "$(sha1sum "$filename" | cut -d' ' -f1)" = "$hash" || {
              echo "::error::An immutable ZIP with this SHA-1 name already exists but has different content"
              exit 1
            }
          else
            cp "$input" "$filename"
            git add "$filename"
            git commit -m "pack: publish immutable resource pack ${hash}"
            git push origin HEAD:refs/heads/pack-assets
          fi
          echo "Published direct binary asset: ${filename}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public direct URL with no redirects and exact SHA-1
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/funnel-pack/funnel-pack.zip"
          hash="$(sha1sum "$input" | cut -d' ' -f1)"
          url="https://raw.githubusercontent.com/${GH_REPO}/pack-assets/funnel-pack-${hash}.zip"
          # Raw GitHub's cache may take a few seconds after the branch push.
          code="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/pack-public-check.zip" \
            --write-out '%{http_code}/%{num_redirects}' "$url")"
          if [[ "$code" != "200/0" ]]; then
            echo "::error::Direct download returned ${code}; expected HTTP 200 without redirects"
            exit 1
          fi
          actual="$(sha1sum "${RUNNER_TEMP}/pack-public-check.zip" | cut -d' ' -f1)"
          if [[ "$actual" != "$hash" ]]; then
            echo "::error::Direct URL payload does not match the JAR resource pack SHA-1"
            exit 1
          fi
          echo "### Direct Minecraft pack URL (HTTP 200; no redirect; hash verified)" >> "$GITHUB_STEP_SUMMARY"
          echo "${url}" >> "$GITHUB_STEP_SUMMARY"
