name: FunnelArmor
version: ${version}
main: dev.emerald.funnel.FunnelArmorPlugin
api-version: '26.3'
author: Emerald
commands:
  funnel:
    description: Funnel and Gundam weapon systems
    usage: /funnel <give|saber|hawk|gn|gn2|gnv|buster|aerial|brau|atomic|mace|satellite|epyon|heavyarms|freedom|hammer|destiny|formation|shield|barrier|angle|pack|reload|status|diagnose>

permissions:
  funnel.admin:
    description: Access all FunnelArmor commands and tab completion
    default: op
  funnel.pack:
    description: Resend your own resource pack
    default: true
  funnel.status:
    description: View public plugin and weapon status
    default: true
  funnel.use:
    description: Change your formation and toggle shield or barrier
    default: true
