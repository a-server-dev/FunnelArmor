# Changes require /funnel reload or a server restart.
beam:
  damage: 2.0
  range: 32.0
  cooldown-ticks: 12
  particle-step: 0.45
pack:
  send-on-join: true
  require: false
  external-url: ""
  embedded-http:
    enabled: true
    bind-host: "0.0.0.0"
    port: 8765
    # "auto" uses the hostname the client used to connect.
    # Port 8765 must route to this Paper server.
    # For a separate Velocity host use Paper's reachable IP/domain.
    public-host: "auto"
drones:
  enabled: true
  orbit-radius: 1.25
  height: 1.45
  bob-amplitude: 0.18
  angular-speed: 0.055
  update-ticks: 2
  teleport-duration: 2
