# Changes require /funnel reload or a server restart.
beam:
  damage: 2.0
  range: 32.0
  cooldown-ticks: 12
  particle-step: 0.45
pack:
  send-on-join: true
  require: false
  external-url: ""
  embedded-http:
    enabled: true
    bind-host: "0.0.0.0"
    port: 8765
    # "auto" uses the hostname the client used to connect.
    # Port 8765 must route to this Paper server.
    # For a separate Velocity host use Paper's reachable IP/domain.
    public-host: "auto"
drones:
  enabled: true
  orbit-radius: 1.65
  height: 1.55
  bob-amplitude: 0.22
  # Scale multiplier for each orbiting ItemDisplay model
  model-scale: 1.45
  # Variant 1: 6, Variant 2: 6, Variant 3: 12, Variant 4: 3
  # Mode is saved per item: orbit/wings/rear/front/spiral
  angular-speed: 0.055
  shot-recoil-blocks: 0.38
  update-ticks: 2
  teleport-duration: 2

# Unicorn-style shield offhand animation and front facing.
shield:
  # The default 0 flips the previous defense stance, exposing the other side.
  # Change to 180 if the installed custom model faces the opposite direction.
  facing-yaw-offset: 0
  deploy-ticks: 12
  retract-ticks: 12
