# Changes require /funnel reload or a server restart.
beam:
  damage: 0.5
  range: 32.0
  cooldown-ticks: 12
  particle-step: 0.45
pack:
  # Only /funnel pack sends the resource pack. The old send-on-join
  # setting is retained for compatibility but is no longer used.
  send-on-join: false
  require: false
  # Default: GitHub direct raw URL (no signed CDN redirect).
  # A GitHub Actions job pushes ZIPs to the public pack-assets branch.
  github-raw:
    enabled: true
    repository: "a-server-dev/FunnelArmor"
  # Legacy fallback: GitHub Releases (may redirect to signed CDN endpoints).
  github-releases:
    enabled: true
    repository: "a-server-dev/FunnelArmor"
  # Optional external host overrides (leave blank for GitHub raw).
  external-base-url: ""
  external-url: ""
  embedded-http:
    # Local HTTP is disabled by default. No port forwarding is needed.
    # For emergency fallback, disable github-raw and github-releases and enable this.
    enabled: false
    bind-host: "0.0.0.0"
    port: 8765
    # "auto" uses the hostname the client used to connect.
    # Port 8765 must route to this Paper server.
    # For a separate Velocity host use Paper's reachable IP/domain.
    public-host: "auto"
drones:
  enabled: true
  orbit-radius: 1.65
  height: 1.55
  bob-amplitude: 0.22
  # Scale multiplier for each orbiting ItemDisplay model
  model-scale: 1.45
  # Variant 1: 6, Variant 2: 6, Variant 3: 12, Variant 4: 3
  # Mode is saved per item: orbit/wings/rear/front/spiral
  angular-speed: 0.055
  shot-recoil-blocks: 0.38
  update-ticks: 2
  teleport-duration: 2

# Unicorn-style shield offhand animation and front facing.
# Three shields overlap like flower petals; each rotates 120 degrees.
# For main-hand shots, the whole Unicorn shield turns so its two -Y barrels
# face the target during the 8-tick firing motion.
shield:
  # The default 0 flips the previous defense stance, exposing the other side.
  # Change to 180 if the installed custom model faces the opposite direction.
  facing-yaw-offset: 0
  deploy-ticks: 12
  retract-ticks: 12

# All shields break after either 5 intercepted attacks or 20 absorbed HP.
barrier-durability:
  max-hits: 5
  max-absorbed-damage: 20.0
  # On break only; manual retraction does not start cooldown.
  cooldown-ticks: 200

# Qubeley variant 3 in the offhand: lock nearest mob at click and
# fly 12 bits around it, firing one 0.5 HP beam every 8 ticks.
qubeley:
  # Model visual size only. 0.25 means 1/4 length, width and height.
  # Applies to both 12-bit mainhand formations and 12-bit offhand attacks.
  # Final display scale = drones.model-scale * model-scale-multiplier.
  model-scale-multiplier: 0.25
  target-range: 8.0
  # Five seconds of pursuit, a half-second return, then ten seconds of cooldown.
  pursuit-ticks: 100
  return-ticks: 10
  cooldown-ticks: 200
  fire-interval-ticks: 8
  damage: 0.5

fin-barrier:
  deploy-ticks: 10
  retract-ticks: 10
  # Bend just the upper/lower U-shaped arm tips vertically away from each
  # other about their rear hinge; does not yaw the whole funnel diagonally.
  # Range -15..15: positive opens in the corrected direction;
  # 0 keeps the arms straight; negative reverses the bend.
  # OP can change it live with /funnel angle -6 (saves to config).
  fin-tip-open-degrees: 6.0
  # Legacy tip-splay-degrees is deliberately ignored (whole-model yaw looked diagonal).
  # Five white stained-glass BlockDisplay panels (front/back/left/right/roof).
  # Visual only; projectile and beam collision still use the plugin's barrier.
  glass-enabled: true
  glass-thickness: 0.035

# ν fin funnel only. The actual deployed muzzle axis is local +X.
# In-game verification showed that 180 degrees is necessary in all idle modes
# (stored / normal / barrier). Firing uses the same +X axis, avoiding a half turn.
# The folded model's long axis is local +Y. Legacy model-yaw-offset is ignored.
fin-funnel:
  yaw-adjustment-degrees: 180
  # Rotation about local Z when the rod-shaped stored model is shown.
  folded-roll-degrees: 90

# Aerial (separate controller, does not change four existing variants).
aerial:
  enabled: true
  # 11 GUND bit meshes are individually scaled to approx. 0.8 block length.
  bit-size-multiplier: 1.0
  target-range: 20.0
  auto-damage: 0.5
  auto-min-interval-ticks: 10
  auto-max-interval-ticks: 28
  assembly-ticks: 10
  shield-max-hits: 5
  shield-max-absorbed-damage: 20.0
  shield-cooldown-ticks: 200
  # First right click charges once, then five separate right clicks fire manually.
  rifle-shots: 5
  rifle-charge-ticks: 20
  rifle-damage: 1.5
  rifle-range: 32.0
  rifle-shot-interval-ticks: 4
  rifle-cooldown-ticks: 200

  # The approved source rifle was authored along -X; rotate its displayed muzzle
  # toward Minecraft's forward axis. Tweak after an in-game orientation check.
  rifle-yaw-offset-degrees: 90.0
  shield-yaw-offset-degrees: 0.0
  bit-yaw-offset-degrees: 90.0
  rifle-muzzle-forward-offset: 1.1
  rifle-muzzle-up-offset: -0.28
  rifle-muzzle-right-offset: 0.33

# Wing Zero EW twin buster rifle (independent weapon, no funnel behavior changes).
twin-buster:
  enabled: true
  dual-range: 30.0
  dual-damage: 1.25
  dual-interval-ticks: 10 # independent left and right cooldowns
  combined-range: 48.0
  combined-damage: 8.0
  combined-radius: 1.20
  # Max particle density of the white core, inner cyan ring, blue outer shell.
  particle-budget: 1800
  charge-ticks: 30
  combined-cooldown-ticks: 200
  mode-switch-ticks: 10

# Original GN Sword V: 6 detachable GN Sword Bits, 4 interchangeable forms.
gn-sword-v:
  enabled: true
  switch-ticks: 12
  attack-cooldown-ticks: 16
  buster-cooldown-ticks: 45
  melee-damage: 5.0
  buster-melee-damage: 9.0
  slash-range: 3.5
  buster-slash-range: 6.0
  slash-damage: 5.0
  buster-slash-damage: 10.0
  rifle-range: 28.0
  buster-rifle-range: 44.0
  rifle-damage: 3.5
  buster-rifle-damage: 9.0

# Beam Saber: five visually distinct extension stages (0 = hilt only).
beam-saber:
  enabled: true
  stage-ticks: 3
  damage: 6.0
  hit-cooldown-ticks: 8

# Heated axe mode adds additional melee damage and a short fire effect.
heat-hawk:
  enabled: true
  damage: 5.0
  hot-damage: 8.0
  fire-ticks: 40

melee-weapons:
  toggle-debounce-ticks: 5

# Double-O GN Sword II: separate twin-blade weapon, not the Qan[T] GN Sword V.
gn-sword-ii:
  enabled: true
  switch-ticks: 10
  attack-cooldown-ticks: 14
  melee-damage: 5.0
  rifle-range: 28.0
  rifle-damage: 3.0

# MAN-03 Brau-Bro: the hand-held controller deploys 4 wire-tethered
# mega-particle gun pods (2 twin-barrel + 2 single-barrel = six emitters).
# Left click or sneak-right toggles deployment; normal right click fires.
brau-bro:
  enabled: true
  model-scale: 0.74
  # Formation distance from player while extended (2..8 blocks).
  extension-distance: 4.2
  # Approximate deployment/retrieval animation duration (4..80 ticks).
  extension-ticks: 16
  # The turrets automatically pursue the player's live location and yaw.
  # Pursuit speed is adaptive; no locked/frozen world-space launch destination.
  # Six beams fired together from four pods, all aimed by the player's crosshair.
  fire-range: 30.0
  fire-cooldown-ticks: 20
  fire-damage-per-beam: 1.5
  max-burst-damage: 9.0
  beam-particle-step: 0.72
