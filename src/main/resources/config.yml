# Changes require /funnel reload or a server restart.
beam:
  damage: 0.5
  range: 32.0
  cooldown-ticks: 12
  particle-step: 0.45
pack:
  # Only /funnel pack sends the resource pack. The old send-on-join
  # setting is retained for compatibility but is no longer used.
  send-on-join: false
  require: false
  # Default: GitHub direct raw URL (no signed CDN redirect).
  # A GitHub Actions job pushes ZIPs to the public pack-assets branch.
  github-raw:
    enabled: true
    repository: "a-server-dev/FunnelArmor"
  # Legacy fallback: GitHub Releases (may redirect to signed CDN endpoints).
  github-releases:
    enabled: true
    repository: "a-server-dev/FunnelArmor"
  # Optional external host overrides (leave blank for GitHub raw).
  external-base-url: ""
  external-url: ""
  embedded-http:
    # Local HTTP is disabled by default. No port forwarding is needed.
    # For emergency fallback, disable github-raw and github-releases and enable this.
    enabled: false
    bind-host: "0.0.0.0"
    port: 8765
    # "auto" uses the hostname the client used to connect.
    # Port 8765 must route to this Paper server.
    # For a separate Velocity host use Paper's reachable IP/domain.
    public-host: "auto"
drones:
  enabled: true
  orbit-radius: 1.65
  height: 1.55
  bob-amplitude: 0.22
  # Scale multiplier for each orbiting ItemDisplay model
  model-scale: 1.45
  # Variant 1: 6, Variant 2: 6, Variant 3: 12, Variant 4: 3
  # Mode is saved per item: orbit/wings/rear/front/spiral
  angular-speed: 0.055
  shot-recoil-blocks: 0.38
  update-ticks: 2
  teleport-duration: 2

# Unicorn-style shield offhand animation and front facing.
# Three shields overlap like flower petals; each rotates 120 degrees.
# For main-hand shots, the whole Unicorn shield turns so its two -Y barrels
# face the target during the 8-tick firing motion.
shield:
  # The default 0 flips the previous defense stance, exposing the other side.
  # Change to 180 if the installed custom model faces the opposite direction.
  facing-yaw-offset: 0
  deploy-ticks: 12
  retract-ticks: 12

fin-barrier:
  deploy-ticks: 10
  retract-ticks: 10
  # Five white stained-glass BlockDisplay panels (front/back/left/right/roof).
  # Visual only; projectile and beam collision still use the plugin's barrier.
  glass-enabled: true
  glass-thickness: 0.035

# ν fin funnel (variant 1) only; common yaw for stored, deployed and barrier.
fin-funnel:
  model-yaw-offset: 90
